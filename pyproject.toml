[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-intelligence-pipeline"
version = "0.1.0"
description = "Event-driven Azure audio transcription and classification pipeline"
requires-python = ">=3.11"
dependencies = [
	"azure-functions>=1.21,<2",
	"azure-functions-durable>=1.2.10,<2",
	"azure-identity>=1.19,<2",
	"azure-storage-blob>=12.24,<13",
	"httpx>=0.28,<1",
	"openai>=2.8,<3",
	"pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "python-dotenv>=1.0,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_pipeline"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
